name: Feature request
description: Suggest something Moni could do.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Check the [roadmap](https://moni.md/notes/roadmap.md) first; it may already be planned.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the task, and what makes it hard in Moni today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help?
      description: Describe how you'd like Moni to handle it.
    validations:
      required: true
